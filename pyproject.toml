[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "friday"
version = "2.0.0"
description = "F.R.I.D.A.Y. v2 — Local-First Personal Computer Agent"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "requests>=2.31",
    "psutil>=5.9",
    "pillow>=10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov"
]

[project.scripts]
friday = "friday.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
