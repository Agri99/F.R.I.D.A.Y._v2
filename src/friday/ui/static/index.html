<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script src="three.min.js"></script>
<script>
  // 1. Scene, Camera, Renderer
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 5;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);

  // Helper function to generate a soft glowing circular particle texture.
  // Bright opaque white alpha keeps the particles fully visible; the
  // material's color (tinted by targetColor) is what provides the hue.
  function createParticleTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');

    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
    gradient.addColorStop(0.35, 'rgba(255, 255, 255, 0.8)');
    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);

    return new THREE.CanvasTexture(canvas);
  }

  const particleTexture = createParticleTexture();


  // 2. Outer Constellation Setup (size: 0.22)
  const sphereGeo = new THREE.SphereGeometry(2, 16, 10);
  const positions = sphereGeo.attributes.position;
  const linePositions = [];

  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    const z = positions.getZ(i);

    linePositions.push(0, 0, 0);
    linePositions.push(x, y, z);
  }

  const raysGeo = new THREE.BufferGeometry();
  raysGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));

  const raysMat = new THREE.LineBasicMaterial({
    color: 0x00ffff,
    transparent: true,
    opacity: 0.35,
    blending: THREE.AdditiveBlending
  });
  const centerRays = new THREE.LineSegments(raysGeo, raysMat);
  scene.add(centerRays);

  const outerNodesGeo = new THREE.BufferGeometry();
  outerNodesGeo.setAttribute('position', sphereGeo.attributes.position);
  const outerNodesMat = new THREE.PointsMaterial({
    color: 0x00ffff,
    size: 0.22, // Increased thickness
    map: particleTexture,
    transparent: true,
    opacity: 0.9,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const outerNodes = new THREE.Points(outerNodesGeo, outerNodesMat);
  scene.add(outerNodes);

  // 3. Inner Core (Small Icosahedron + Corner Nodes, size: 0.15)
  const coreGeometry = new THREE.IcosahedronGeometry(0.8, 1);
  const coreMaterial = new THREE.MeshBasicMaterial({
    color: 0x00ffff,
    wireframe: true,
    transparent: true,
    opacity: 0.3,
    blending: THREE.AdditiveBlending
  });
  const innerCore = new THREE.Mesh(coreGeometry, coreMaterial);
  scene.add(innerCore);

  const innerNodesGeo = new THREE.BufferGeometry();
  innerNodesGeo.setAttribute('position', coreGeometry.attributes.position);
  const innerNodesMat = new THREE.PointsMaterial({
    color: 0x00ffff,
    size: 0.15, // Increased thickness
    map: particleTexture,
    transparent: true,
    opacity: 0.9,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const innerNodes = new THREE.Points(innerNodesGeo, innerNodesMat);
  scene.add(innerNodes);

  // 4. Middle Sphere Nodes & Center Rays (size: 0.18)
  const middleGeometry = new THREE.SphereGeometry(1.5, 10, 8);
  const middlePositions = middleGeometry.attributes.position;
  const middleLinePositions = [];

  for (let i = 0; i < middlePositions.count; i++) {
    const x = middlePositions.getX(i);
    const y = middlePositions.getY(i);
    const z = middlePositions.getZ(i);

    middleLinePositions.push(0, 0, 0);
    middleLinePositions.push(x, y, z);
  }

  const middleRaysGeo = new THREE.BufferGeometry();
  middleRaysGeo.setAttribute('position', new THREE.Float32BufferAttribute(middleLinePositions, 3));

  const middleRaysMat = new THREE.LineBasicMaterial({
    color: 0x00ffff,
    transparent: true,
    opacity: 0.3,
    blending: THREE.AdditiveBlending
  });
  const middleCenterRays = new THREE.LineSegments(middleRaysGeo, middleRaysMat);
  scene.add(middleCenterRays);

  const middleNodesGeo = new THREE.BufferGeometry();
  middleNodesGeo.setAttribute('position', middleGeometry.attributes.position);
  const middleNodesMat = new THREE.PointsMaterial({
    color: 0x00ffff,
    size: 0.18, // Increased thickness
    map: particleTexture,
    transparent: true,
    opacity: 0.8,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const middleNodes = new THREE.Points(middleNodesGeo, middleNodesMat);
  scene.add(middleNodes);

  // 5. State Colors & Dynamics
  const styles = {
    idle:                 { color: 0x00ffff, speed: 1.0,  pulse: 0.008 },
    listening:            { color: 0x00ff88, speed: 5.0,  pulse: 0.030 },
    thinking:             { color: 0xbb33ff, speed: 7.0,  pulse: 0.025 },
    speaking:             { color: 0xff1000, speed: 3.0,  pulse: 0.035 },


    waiting_confirmation: { color: 0xffdd00, speed: 1.4,  pulse: 0.025 },
    followup_listening: { color: 0x00ff88, speed: 5.0,  pulse: 0.030 },
    executing:            { color: 0x33ff66, speed: 2.0,  pulse: 0.025 },
    error:                { color: 0xff2244, speed: 0.8,  pulse: 0.015 }
  };

  let targetColor = new THREE.Color(styles.idle.color);
  let speedMultiplier = styles.idle.speed;
  let pulseSpeed = styles.idle.pulse;
  let time = 0;
  let t = 0;

  // 6. WebSocket State Integration
  function connect() {
    const ws = new WebSocket("ws://127.0.0.1:8765");
    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.state) {
          const s = styles[data.state.toLowerCase()] || styles.idle;
          targetColor = new THREE.Color(s.color);
          speedMultiplier = s.speed;
          pulseSpeed = s.pulse;
        }
        if (data.visibility === "hide" && window.bridge) {
          window.bridge.hideWindow();
        }
        if (data.visibility === "show" && window.bridge) {
          window.bridge.showWindow();
        }
      } catch (err) {
        console.error(err);
      }
    };
    ws.onclose = () => setTimeout(connect, 1000);
  }
  connect();

  // 7. Animation Loop (from spin.html)
  function animate() {
    requestAnimationFrame(animate);
    time += 0.01 * speedMultiplier;
    t += pulseSpeed;

    const scale = 1.5 + Math.sin(t) * 0.03;
    scene.scale.set(scale, scale, scale);

    const rx = Math.sin(time * 0.5) * 0.5;
    const ry = Math.cos(time * 0.3) * 0.7;
    const rz = Math.sin(time * 0.7) * 0.3;

    // Rotate differently based on state/speedMultiplier
    const stateWobble = (speedMultiplier > 1.5) ? Math.sin(t*2)*0.1 : 0;
    
    // Rotate outer rays and nodes together
    centerRays.rotation.x = outerNodes.rotation.x = rx + stateWobble;
    centerRays.rotation.y = outerNodes.rotation.y = ry + stateWobble;
    centerRays.rotation.z = outerNodes.rotation.z = rz;

    // Inner core mesh and its corner nodes rotate together
    const innerSpeed = (speedMultiplier > 2.0) ? 0.08 : 0.03 * speedMultiplier;
    innerCore.rotation.x = innerNodes.rotation.x -= innerSpeed;
    innerCore.rotation.y = innerNodes.rotation.y -= (innerSpeed/2);

    // Middle center rays and its nodes locked together, spinning in the opposite direction
    const midRotX = middleCenterRays.rotation.x + (0.02 * speedMultiplier);
    const midRotY = middleCenterRays.rotation.y + (0.025 * speedMultiplier);

    middleNodes.rotation.x = middleCenterRays.rotation.x = midRotX;
    middleNodes.rotation.y = middleCenterRays.rotation.y = midRotY;

    // Smooth state color transition
    raysMat.color.lerp(targetColor, 0.06);
    outerNodesMat.color.lerp(targetColor, 0.06);
    coreMaterial.color.lerp(targetColor, 0.06);
    innerNodesMat.color.lerp(targetColor, 0.06);
    middleRaysMat.color.lerp(targetColor, 0.06);
    middleNodesMat.color.lerp(targetColor, 0.06);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

<!-- QWebChannel for drag and native window control -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  window.bridge = null;
  if (typeof QWebChannel !== "undefined" && typeof qt !== "undefined") {
    new QWebChannel(qt.webChannelTransport, (channel) => {
      window.bridge = channel.objects.bridge;
    });
  }

  let dragging = false, lastX = 0, lastY = 0;
  document.body.addEventListener("mousedown", (e) => {
    dragging = true;
    lastX = e.screenX;
    lastY = e.screenY;
  });
  document.addEventListener("mousemove", (e) => {
    if (!dragging || !window.bridge) return;
    window.bridge.moveBy(e.screenX - lastX, e.screenY - lastY);
    lastX = e.screenX;
    lastY = e.screenY;
  });
  document.addEventListener("mouseup", () => { dragging = false; });
</script>
</body>
</html>
