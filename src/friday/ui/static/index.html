<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
<script src="three.min.js"></script>
<script>
  // 1. Scene, Camera, Renderer
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 4.8;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);

  // Helper function to generate soft glowing circular particle texture
  function createParticleTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 64;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');

    const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
    gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
    gradient.addColorStop(0.3, 'rgba(0, 255, 255, 0.85)');
    gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, 64, 64);

    return new THREE.CanvasTexture(canvas);
  }

  const particleTexture = createParticleTexture();

  // 2. Outer Constellation Setup (from spin.html)
  const sphereGeo = new THREE.SphereGeometry(2.0, 16, 10);
  const positions = sphereGeo.attributes.position;
  const linePositions = [];

  for (let i = 0; i < positions.count; i++) {
    const x = positions.getX(i);
    const y = positions.getY(i);
    const z = positions.getZ(i);

    linePositions.push(0, 0, 0);
    linePositions.push(x, y, z);
  }

  const raysGeo = new THREE.BufferGeometry();
  raysGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));

  const raysMat = new THREE.LineBasicMaterial({
    color: 0x00ffff,
    transparent: true,
    opacity: 0.25,
    blending: THREE.AdditiveBlending
  });
  const centerRays = new THREE.LineSegments(raysGeo, raysMat);
  scene.add(centerRays);

  const outerNodesGeo = new THREE.BufferGeometry();
  outerNodesGeo.setAttribute('position', sphereGeo.attributes.position);
  const outerNodesMat = new THREE.PointsMaterial({
    color: 0x00ffff,
    size: 0.14,
    map: particleTexture,
    transparent: true,
    opacity: 0.95,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const outerNodes = new THREE.Points(outerNodesGeo, outerNodesMat);
  scene.add(outerNodes);

  // 3. Inner Core (Small Icosahedron)
  const coreGeometry = new THREE.IcosahedronGeometry(0.8, 1);
  const coreMaterial = new THREE.MeshBasicMaterial({
    color: 0x00ffff,
    wireframe: true,
    transparent: true,
    opacity: 0.5,
    blending: THREE.AdditiveBlending
  });
  const innerCore = new THREE.Mesh(coreGeometry, coreMaterial);
  scene.add(innerCore);

  // 4. Middle Sphere + Corner Nodes
  const middleGeometry = new THREE.SphereGeometry(1.4, 10, 8);
  const middleMaterial = new THREE.MeshBasicMaterial({
    color: 0x00ffff,
    wireframe: true,
    transparent: true,
    opacity: 0.35,
    blending: THREE.AdditiveBlending
  });
  const middleCore = new THREE.Mesh(middleGeometry, middleMaterial);
  scene.add(middleCore);

  const middleNodesGeo = new THREE.BufferGeometry();
  middleNodesGeo.setAttribute('position', middleGeometry.attributes.position);
  const middleNodesMat = new THREE.PointsMaterial({
    color: 0x00ffff,
    size: 0.11,
    map: particleTexture,
    transparent: true,
    opacity: 0.85,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  const middleNodes = new THREE.Points(middleNodesGeo, middleNodesMat);
  scene.add(middleNodes);

  // 5. State Colors & Dynamics
  const styles = {
    idle:                 { color: 0x00ffff, speed: 1.0,  pulse: 0.008 },
    listening:            { color: 0x00ff88, speed: 1.6,  pulse: 0.030 },
    thinking:             { color: 0xbb33ff, speed: 2.2,  pulse: 0.025 },
    speaking:             { color: 0xffaa00, speed: 1.8,  pulse: 0.035 },
    waiting_confirmation: { color: 0xffdd00, speed: 1.4,  pulse: 0.025 },
    executing:            { color: 0x33ff66, speed: 2.0,  pulse: 0.025 },
    error:                { color: 0xff2244, speed: 0.8,  pulse: 0.015 }
  };

  let targetColor = new THREE.Color(styles.idle.color);
  let speedMultiplier = styles.idle.speed;
  let pulseSpeed = styles.idle.pulse;
  let time = 0;
  let t = 0;

  // 6. WebSocket State Integration
  function connect() {
    const ws = new WebSocket("ws://127.0.0.1:8765");
    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.state) {
          const s = styles[data.state.toLowerCase()] || styles.idle;
          targetColor = new THREE.Color(s.color);
          speedMultiplier = s.speed;
          pulseSpeed = s.pulse;
        }
        if (data.visibility === "hide" && window.bridge) {
          window.bridge.hideWindow();
        }
        if (data.visibility === "show" && window.bridge) {
          window.bridge.showWindow();
        }
      } catch (err) {
        console.error(err);
      }
    };
    ws.onclose = () => setTimeout(connect, 1000);
  }
  connect();

  // 7. Animation Loop (from spin.html)
  function animate() {
    requestAnimationFrame(animate);
    time += 0.01 * speedMultiplier;
    t += pulseSpeed;

    const scale = 1 + Math.sin(t) * 0.04;
    scene.scale.set(scale, scale, scale);

    const rx = Math.sin(time * 0.5) * 0.5;
    const ry = Math.cos(time * 0.3) * 0.7;
    const rz = Math.sin(time * 0.7) * 0.3;

    // Rotate outer rays and nodes together
    centerRays.rotation.x = outerNodes.rotation.x = rx;
    centerRays.rotation.y = outerNodes.rotation.y = ry;
    centerRays.rotation.z = outerNodes.rotation.z = rz;

    // Inner core rotation (spins one way)
    innerCore.rotation.x -= 0.03 * speedMultiplier;
    innerCore.rotation.y -= 0.015 * speedMultiplier;

    // Middle sphere and its nodes locked together, spinning in the opposite direction
    middleCore.rotation.x = middleNodes.rotation.x += 0.02 * speedMultiplier;
    middleCore.rotation.y = middleNodes.rotation.y += 0.025 * speedMultiplier;

    // Smooth color transition
    raysMat.color.lerp(targetColor, 0.06);
    outerNodesMat.color.lerp(targetColor, 0.06);
    coreMaterial.color.lerp(targetColor, 0.06);
    middleMaterial.color.lerp(targetColor, 0.06);
    middleNodesMat.color.lerp(targetColor, 0.06);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>

<!-- QWebChannel for drag and native window control -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  window.bridge = null;
  if (typeof QWebChannel !== "undefined" && typeof qt !== "undefined") {
    new QWebChannel(qt.webChannelTransport, (channel) => {
      window.bridge = channel.objects.bridge;
    });
  }

  let dragging = false, lastX = 0, lastY = 0;
  document.body.addEventListener("mousedown", (e) => {
    dragging = true;
    lastX = e.screenX;
    lastY = e.screenY;
  });
  document.addEventListener("mousemove", (e) => {
    if (!dragging || !window.bridge) return;
    window.bridge.moveBy(e.screenX - lastX, e.screenY - lastY);
    lastX = e.screenX;
    lastY = e.screenY;
  });
  document.addEventListener("mouseup", () => { dragging = false; });
</script>
</body>
</html>
