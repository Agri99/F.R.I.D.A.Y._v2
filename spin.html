<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. UI - Dual Sphere Nodes</title>
    <style>
        body {
            margin: 0;
            background-color: #050b14;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // 1. Scene, Camera, Renderer
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Helper function to generate a soft glowing circular particle texture
        function createParticleTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(0, 255, 255, 0.8)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 64, 64);

            return new THREE.CanvasTexture(canvas);
        }

        const particleTexture = createParticleTexture();

        // 2. Outer Constellation Setup
        const sphereGeo = new THREE.SphereGeometry(2, 16, 10);
        const positions = sphereGeo.attributes.position;
        const linePositions = [];

        for (let i = 0; i < positions.count; i++) {
            const x = positions.getX(i);
            const y = positions.getY(i);
            const z = positions.getZ(i);

            linePositions.push(0, 0, 0);
            linePositions.push(x, y, z);
        }

        const raysGeo = new THREE.BufferGeometry();
        raysGeo.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));

        const raysMat = new THREE.LineBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.2,
            blending: THREE.AdditiveBlending
        });
        const centerRays = new THREE.LineSegments(raysGeo, raysMat);
        scene.add(centerRays);

        const outerNodesGeo = new THREE.BufferGeometry();
        outerNodesGeo.setAttribute('position', sphereGeo.attributes.position);
        const outerNodesMat = new THREE.PointsMaterial({
            color: 0x00ffff,
            size: 0.12,
            map: particleTexture,
            transparent: true,
            opacity: 0.9,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const outerNodes = new THREE.Points(outerNodesGeo, outerNodesMat);
        scene.add(outerNodes);

        // 3. Inner Core (Small Icosahedron + Corner Nodes)
        const coreGeometry = new THREE.IcosahedronGeometry(0.8, 1);
        const coreMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const innerCore = new THREE.Mesh(coreGeometry, coreMaterial);
        scene.add(innerCore);

        // Create glowing vertex points for the inner core
        const innerNodesGeo = new THREE.BufferGeometry();
        innerNodesGeo.setAttribute('position', coreGeometry.attributes.position);
        const innerNodesMat = new THREE.PointsMaterial({
            color: 0x00ffff,
            size: 0.08,
            map: particleTexture,
            transparent: true,
            opacity: 0.9,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const innerNodes = new THREE.Points(innerNodesGeo, innerNodesMat);
        scene.add(innerNodes);

        // 4. Middle Sphere Nodes & Center Rays
        const middleGeometry = new THREE.SphereGeometry(1.5, 10, 8);
        const middlePositions = middleGeometry.attributes.position;
        const middleLinePositions = [];

        for (let i = 0; i < middlePositions.count; i++) {
            const x = middlePositions.getX(i);
            const y = middlePositions.getY(i);
            const z = middlePositions.getZ(i);

            middleLinePositions.push(0, 0, 0);
            middleLinePositions.push(x, y, z);
        }

        const middleRaysGeo = new THREE.BufferGeometry();
        middleRaysGeo.setAttribute('position', new THREE.Float32BufferAttribute(middleLinePositions, 3));

        const middleRaysMat = new THREE.LineBasicMaterial({
            color: 0x00ffff,
            transparent: true,
            opacity: 0.15,
            blending: THREE.AdditiveBlending
        });
        const middleCenterRays = new THREE.LineSegments(middleRaysGeo, middleRaysMat);
        scene.add(middleCenterRays);

        const middleNodesGeo = new THREE.BufferGeometry();
        middleNodesGeo.setAttribute('position', middleGeometry.attributes.position);
        const middleNodesMat = new THREE.PointsMaterial({
            color: 0x00ffff,
            size: 0.10,
            map: particleTexture,
            transparent: true,
            opacity: 0.8,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });
        const middleNodes = new THREE.Points(middleNodesGeo, middleNodesMat);
        scene.add(middleNodes);

        camera.position.z = 5;

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 5. Animation Loop
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            const rx = Math.sin(time * 0.5) * 0.5;
            const ry = Math.cos(time * 0.3) * 0.7;
            const rz = Math.sin(time * 0.7) * 0.3;

            // Rotate outer rays and nodes together
            centerRays.rotation.x = outerNodes.rotation.x = rx;
            centerRays.rotation.y = outerNodes.rotation.y = ry;
            centerRays.rotation.z = outerNodes.rotation.z = rz;

            // Inner core mesh and its new corner nodes rotate together
            innerCore.rotation.x = innerNodes.rotation.x -= 0.03;
            innerCore.rotation.y = innerNodes.rotation.y -= 0.015;

            // Middle center rays and its nodes locked together, spinning in the opposite direction
            const midRotX = middleCenterRays.rotation.x + 0.02;
            const midRotY = middleCenterRays.rotation.y + 0.025;

            middleNodes.rotation.x = middleCenterRays.rotation.x = midRotX;
            middleNodes.rotation.y = middleCenterRays.rotation.y = midRotY;

            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
