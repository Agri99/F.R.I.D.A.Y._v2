# SearXNG Docker Compose - Official Template
# Source: https://raw.githubusercontent.com/searxng/searxng/master/container/docker-compose.yml
version: "3.8"

services:
  redis:
    container_name: searxng-valkey
    image: valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --save 300 10 --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - searxng-network
    volumes:
      - ./valkey:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  searxng:
    container_name: searxng-core
    image: searxng/searxng:latest
    networks:
      - searxng-network
    ports:
      - "${SEARXNG_HOST:-127.0.0.1}:${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}"
    environment:
      - SEARXNG_VERSION=${SEARXNG_VERSION:-latest}
      - SEARXNG_HOST=${SEARXNG_HOST:-127.0.0.1}
      - SEARXNG_PORT=${SEARXNG_PORT:-8080}
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-}
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_LIMITER=${SEARXNG_LIMITER:-false}
      - SEARXNG_IMAGE_PROXY=${SEARXNG_IMAGE_PROXY:-true}
      - SEARXNG_REDIS_URL=redis://redis:6379/0
    volumes:
      - ./core-config/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          memory: 1G

networks:
  searxng-network:
    driver: bridge