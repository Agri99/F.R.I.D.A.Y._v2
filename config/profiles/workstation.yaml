# Workstation profile — maximum capability
# Suitable for 32+ GB RAM, high-end GPU with 12+ GB VRAM, CUDA available

models:
  fast:
    provider: "ollama"
    model: "qwen3:8b"
  reasoning:
    provider: "ollama"
    model: "qwen3:32b"
  vision:
    provider: "ollama"
    model: "qwen3-vl:32b"
  embedding:
    provider: "ollama"
    model: "nomic-embed-text"
  stt:
    engine: "faster-whisper"
    model: "large-v3"
  tts:
    engine: "piper"
    voice: "en_GB-jenny_dioco-medium"

runtime:
  max_task_steps: 40
  max_retries_per_step: 3
  tool_timeout_seconds: 60
  context_window_messages: 80
  keep_recent_messages: 50

voice:
  stt_model: "large-v3"
  followup_window_seconds: 8.0

