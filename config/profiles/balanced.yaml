# Balanced profile — moderate resource usage
# Suitable for 16-32 GB RAM, mid-range dedicated GPU with 6-8 GB VRAM

models:
  fast:
    provider: "ollama"
    model: "qwen3:4b"
  reasoning:
    provider: "ollama"
    model: "qwen3:14b"
  vision:
    provider: "ollama"
    model: "qwen3-vl:8b"
  embedding:
    provider: "ollama"
    model: "nomic-embed-text"
  stt:
    engine: "faster-whisper"
    model: "medium"
  tts:
    engine: "piper"
    voice: "en_GB-jenny_dioco-medium"

runtime:
  max_task_steps: 25
  max_retries_per_step: 3
  tool_timeout_seconds: 45
  context_window_messages: 50
  keep_recent_messages: 35

voice:
  stt_model: "medium"
  followup_window_seconds: 6.0

