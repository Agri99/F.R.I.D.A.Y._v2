# Laptop profile — conservative resource usage
# Suitable for 8-16 GB RAM, integrated/low-end GPU, no CUDA

models:
  fast:
    provider: "ollama"
    model: "qwen3:4b"
  reasoning:
    provider: "ollama"
    model: "qwen3:8b"
  vision:
    provider: "ollama"
    model: "qwen3-vl:8b"
  embedding:
    provider: "ollama"
    model: "nomic-embed-text"
  stt:
    engine: "faster-whisper"
    model: "small"
  tts:
    engine: "piper"
    voice: "en_GB-jenny_dioco-medium"

runtime:
  max_task_steps: 15
  max_retries_per_step: 2
  tool_timeout_seconds: 30
  context_window_messages: 30
  keep_recent_messages: 20

voice:
  stt_model: "small"
  followup_window_seconds: 5.0

