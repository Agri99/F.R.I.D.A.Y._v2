# F.R.I.D.A.Y. Gemini Cloud Configuration Overlay
# Use with FRIDAY_ENV=gemini or via CLI `--brain gemini`

models:
  fast:
    provider: "gemini"
    model: "gemini-3.5-flash-lite"
    supports_tools: true
    supports_vision: true
  reasoning:
    provider: "gemini"
    model: "gemini-3.8-flash"
    supports_tools: true
    supports_vision: true
  vision:
    provider: "gemini"
    model: "gemini-3.8-flash"
    supports_tools: true
    supports_vision: true

live:
  model: "gemini-3.1-flash-live-preview"
  voice:
  audio_prompt_path: "models/voice_reference.wav"
  exaggeration: 0.5  # Expressiveness level

voice:
  tts_engine: "chatterbox_turbo"
  device: "cuda"
  model_path: "models/chatterbox-turbo"
  audio_prompt_path: "models/voice_reference.wav"
  exaggeration: 0.5
  barge_in: true
  bargein_min_frames: 3
  followup_window_seconds: 10.0
  speech_director:
    enabled: true
    mode: "rules"
    max_tags_per_sentence: 1
    allow_vocal_effects: true
    allow_experimental_emotion_tags: true
    log_decisions: true


