app:
  name: "FRIDAY"
  offline_first: true
  autonomy_level: 2  # ASSISTED

network:
  assume_online: false
  probe_interval_seconds: 30
  probe_urls: ["https://www.google.com"]

models:
  fast:
    provider: "ollama"
    model: "qwen2.5:3b"
    supports_tools: true
  reasoning:
    provider: "ollama"
    model: "qwen2.5:3b"
  vision:
    provider: "ollama"
    model: "llava:latest"


runtime:
  max_task_steps: 20
  max_retries_per_step: 2
  tool_timeout_seconds: 30
  max_recording_seconds: 18
  context_window_messages: 40
  keep_recent_messages: 30

voice:
  wake_word: "FRIDAY"
  stt_model: "small"
  tts_engine: "chatterbox_turbo"
  device: "cuda"
  model_path: "models/chatterbox-turbo"
  audio_prompt_path: "models/voice_reference.wav"
  exaggeration: 0.35
  barge_in: true
  bargein_min_frames: 3      # consecutive speech frames needed before interrupting (~64ms each, ~190ms)
  barge_in_min_rms: 1200.0   # minimum energy required to interrupt over speaker output
  barge_in_vad_threshold: 0.65 # neural silero speech confidence floor
  language: "auto"
  language_chain: ["en", "id", "su"]
  followup_window_seconds: 10.0
  event_driven: true
  vad_threshold: 50.0
  multilingual_routing: false
  multilingual_engine: "edge_tts"  # 'edge_tts' (unlimited/fast) or 'gemini' (10 req/day quota on free tier) or set multilingual_routing: false for 100% Chatterbox Lune
  gemini_voice: "Aoede"
  indonesian_voice: "id-ID-GadisNeural"
  speech_director:
    enabled: true
    mode: "rules"
    max_tags_per_sentence: 1
    allow_vocal_effects: true
    allow_experimental_emotion_tags: true
    production_tags:
      - happy
      - dramatic
      - whispering
    limited_tags:
      - laugh
    disabled_tags:
      - chuckle
      - sigh
      - gasp
      - sarcastic
      - angry
      - crying
      - fear
      - surprised
    expression_blend_weights:
      happy: 0.65
      dramatic: 0.60
      whispering: 0.70
      laugh: 0.50
    log_decisions: true

search:
  enabled: true
  base_url: "http://127.0.0.1:8080"
  timeout_seconds: 6
  max_results: 5
  language: "en"
  safe_search: 1
  specialized_fallbacks: true


security:
  default_risk_tier: "RED"
  auto_approve_tiers: ["GREEN", "YELLOW"]
  confirm_required_tiers: ["YELLOW", "ORANGE"]
  hard_block_without_second_factor: ["RED"]
  default_filesystem_root: "./workspace"
  require_voice_auth_for_orange: true
  require_passphrase_for_red: true
  confirmation_ttl_seconds: 60

learning:
  enabled: true
  auto_create_skills: true
  auto_promote_skills: false
  require_validation: true
  minimum_successes: 3
  minimum_success_rate: 0.85
  minimum_verification_pass_rate: 0.95
  max_recent_failures: 1
  require_sandbox_pass: true

browser:
  enabled: true
  engine: "playwright"

google:
  gmail_enabled: true
  calendar_enabled: true

paths:
  data_dir: "./data"
  audit_dir: "./data/audit"
  trajectories_dir: "./data/trajectories"
  skills_dir: "./skills"
  secrets_dir: "./secrets"
  workspace_dir: "./workspace"
  models_dir: "./models"

jobs:
  enabled: true
  jobs_dir: "./data/jobs"
  max_concurrent: 2

hardware:
  profile: "auto"

terminal:
  sandbox_enabled: true
  host_enabled: false
  sandbox_dir: "./workspace/sandbox"
  host_allowlist:
    - "git status"
    - "git log"
    - "git diff"
    - "pip list"
    - "python"
    - "python --version"
    - "ollama list"
